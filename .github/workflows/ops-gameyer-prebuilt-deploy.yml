name: Ops GameYer prebuilt production deploy

on:
  push:
    branches: [ops/deploy-map-preview]

permissions:
  contents: read

concurrency:
  group: ops-gameyer-prebuilt-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy gameyer prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout merged production SHA
        uses: actions/checkout@v7
        with:
          ref: 0d25cf49a5121b91ba175ca217e2b9a70062251e

      - name: Require Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN secret is missing.' >&2; exit 1; }
          test -n "${VERCEL_ORG_ID:-}" || { echo 'VERCEL_ORG_ID secret is missing.' >&2; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo 'VERCEL_PROJECT_ID secret is missing.' >&2; exit 1; }

      - name: Safety gate — require exact gameyer project
        shell: bash
        run: |
          set -euo pipefail
          project_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"
          if [[ "${VERCEL_ORG_ID}" == team_* ]]; then
            project_url="${project_url}?teamId=${VERCEL_ORG_ID}"
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${project_url}" > /tmp/vercel-project.json
          node <<'NODE'
          const fs = require('node:fs');
          const project = JSON.parse(fs.readFileSync('/tmp/vercel-project.json', 'utf8'));
          if (project.name !== 'gameyer') {
            console.error(`Refusing deploy: expected Vercel project gameyer, resolved ${project.name || 'unknown'}.`);
            process.exit(1);
          }
          console.log('Safety gate passed: Vercel project is exactly gameyer.');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link exact project and pull production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          }));
          NODE
          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build locally for production
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt output to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}")"
          printf '%s\n' "$output"
          deploy_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1)"
          test -n "$deploy_url" || { echo 'Could not extract Vercel deployment URL.' >&2; exit 1; }
          echo "deployment_url=${deploy_url}" >> "$GITHUB_OUTPUT"

      - name: Verify production domain
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent --show-error https://gameyer.az/api/health | grep -q '"ok":true'; then
              echo 'gameyer.az production health is OK.'
              exit 0
            fi
            sleep 2
          done
          echo 'gameyer.az did not become healthy after prebuilt deploy.' >&2
          exit 1
