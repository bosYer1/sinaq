name: Production Analytics Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/analytics/**'
      - 'src/lib/google-analytics.ts'
      - 'src/lib/posthog.ts'
      - 'src/lib/meta-pixel.ts'
      - 'scripts/production-analytics-browser-smoke.mjs'
      - '.github/workflows/production-analytics-smoke.yml'

permissions:
  contents: read

concurrency:
  group: production-analytics-smoke
  cancel-in-progress: true

jobs:
  analytics-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production deployment propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 15 https://gameyer.az/ >/dev/null; then
              echo "Production is reachable"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become reachable" >&2
          exit 1
      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - name: Run tagged browser analytics smoke
        env:
          TEST_BASE_URL: https://gameyer.az
        run: node scripts/production-analytics-browser-smoke.mjs
