name: Production Analytics Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/analytics/**'
      - 'src/lib/google-analytics.ts'
      - 'src/lib/posthog.ts'
      - 'src/lib/meta-pixel.ts'
      - 'scripts/production-analytics-browser-smoke.mjs'
      - '.github/workflows/production-analytics-smoke.yml'

permissions:
  contents: read

concurrency:
  group: production-analytics-smoke
  cancel-in-progress: true

jobs:
  analytics-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_BASE_URL: https://gameyer.az
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this commit's Vercel deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            state="$(STATUS_JSON="$json" node -e "const s=JSON.parse(process.env.STATUS_JSON); const v=s.statuses.find((x)=>x.context==='Vercel'); process.stdout.write(v?.state || 'pending')")"
            if [ "$state" = 'success' ]; then
              exit 0
            fi
            if [ "$state" = 'failure' ] || [ "$state" = 'error' ]; then
              echo "Vercel deployment status: $state" >&2
              exit 1
            fi
            sleep 5
          done
          echo 'Timed out waiting for Vercel deployment.' >&2
          exit 1
      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "${TEST_BASE_URL}/api/health" > /tmp/health.json
          grep '"ok":true' /tmp/health.json > /dev/null
          grep '"database":"ok"' /tmp/health.json > /dev/null
      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - name: Run tagged browser analytics smoke
        run: node scripts/production-analytics-browser-smoke.mjs
