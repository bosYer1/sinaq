name: Mobile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Mobile verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject private mobile credentials
        working-directory: .
        run: |
          # Tests deliberately construct invalid role tokens to verify rejection.
          if git grep -nE -- 'EXPO_PUBLIC_.*(sb_secret_|service_role)|SUPABASE_(SECRET|SERVICE_ROLE)' -- mobile ':!mobile/package-lock.json' ':!mobile/**/*.test.ts'; then
            echo 'Private Supabase credential pattern found in mobile code.' >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Android and iOS bundle export
        run: npm run build
