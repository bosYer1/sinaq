name: Dependency Lock Refresh Once

on:
  push:
    branches:
      - codex/data-resilience-20261006

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/data-resilience-20261006
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile from pinned package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:codex/data-resilience-20261006
