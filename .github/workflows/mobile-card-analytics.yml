name: Mobile Card Analytics

on:
  pull_request:
    paths:
      - 'src/components/clubs/ClubCard.tsx'
      - 'src/lib/posthog.ts'
      - 'scripts/mobile-card-click-browser-smoke.mjs'
      - '.github/workflows/mobile-card-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/clubs/ClubCard.tsx'
      - 'src/lib/posthog.ts'
      - 'scripts/mobile-card-click-browser-smoke.mjs'
      - '.github/workflows/mobile-card-analytics.yml'

permissions:
  contents: read

concurrency:
  group: mobile-card-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Mobile Card Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://uxcedpbumulpheglhlvs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZRyHR5Qj2LmbCZVsKTBZ4Q_eRByoSYf
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/gameyer-mobile-card-analytics.log 2>&1 &
          echo $! > /tmp/gameyer-mobile-card-analytics.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gameyer-mobile-card-analytics.log
          exit 1

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"

      - name: Verify mobile club card analytics before hard navigation
        shell: bash
        run: |
          set -euo pipefail
          port=$((20000 + RANDOM % 20000))
          MOBILE_CARD_ANALYTICS_CDP_PORT="$port" node scripts/mobile-card-click-browser-smoke.mjs

      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/gameyer-mobile-card-analytics.pid ]; then
            kill "$(cat /tmp/gameyer-mobile-card-analytics.pid)" || true
          fi
