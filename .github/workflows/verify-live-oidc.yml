name: Verify live production

on:
  push:
    branches: [ops/verify-live-oidc]
    paths:
      - '.github/workflows/verify-live-oidc.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Production SEO and health proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health mode
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            https://gameyer.az/api/health > /tmp/health.json
          cat /tmp/health.json
          grep '"ok":true' /tmp/health.json > /dev/null
          grep '"database":"ok"' /tmp/health.json > /dev/null
          grep '"analytics_write":"vercel-oidc-edge"' /tmp/health.json > /dev/null

      - name: Verify latest homepage SEO title
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            https://gameyer.az/ > /tmp/home.html
          grep -o '<title>[^<]*</title>' /tmp/home.html | head -1
          grep -o '<link rel="canonical"[^>]*>' /tmp/home.html | head -1
          grep -F '<title>GameYer — Bakıda gaming, PC və PlayStation klubları</title>' /tmp/home.html > /dev/null
          grep -F '<link rel="canonical" href="https://gameyer.az"/>' /tmp/home.html > /dev/null
