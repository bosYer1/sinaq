name: CI

on:
  push:
    branches: [main, launch-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://uxcedpbumulpheglhlvs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZRyHR5Qj2LmbCZVsKTBZ4Q_eRByoSYf
      NEXT_PUBLIC_SITE_URL: https://gameyerr-gameyer.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate migration manifest
        run: |
          set -euo pipefail
          sort supabase/production-migrations.txt > /tmp/expected-migrations.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed 's/\.sql$//' \
            | sort > /tmp/repo-migrations.txt
          diff -u /tmp/expected-migrations.txt /tmp/repo-migrations.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/gameyer-next.log 2>&1 &
          echo $! > /tmp/gameyer-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gameyer-next.log
          exit 1

      - name: Smoke test public routes
        run: |
          set -euo pipefail
          curl --fail --silent --dump-header /tmp/public-headers --output /dev/null http://127.0.0.1:3000/
          grep -Ei "^content-security-policy: .*default-src 'self'" /tmp/public-headers > /dev/null
          grep -Ei "^content-security-policy: .*frame-ancestors 'none'" /tmp/public-headers > /dev/null
          grep -Ei '^content-security-policy: .*basemaps\.cartocdn\.com' /tmp/public-headers > /dev/null
          grep -Ei '^content-security-policy: .*uxcedpbumulpheglhlvs\.supabase\.co' /tmp/public-headers > /dev/null
          grep -Ei '^x-frame-options: DENY' /tmp/public-headers > /dev/null
          grep -Ei '^x-content-type-options: nosniff' /tmp/public-headers > /dev/null
          grep -Ei '^referrer-policy: strict-origin-when-cross-origin' /tmp/public-headers > /dev/null
          curl --fail --silent http://127.0.0.1:3000/rayon > /dev/null
          curl --fail --silent http://127.0.0.1:3000/tip > /dev/null
          curl --fail --silent --dump-header /tmp/health-headers --output /tmp/health.json http://127.0.0.1:3000/api/health
          grep -Ei '^x-robots-tag: noindex, nofollow' /tmp/health-headers > /dev/null
          grep '"ok":true' /tmp/health.json > /dev/null
          grep '"database":"ok"' /tmp/health.json > /dev/null
          ! grep -E 'activeClubs|responseMs|timestamp' /tmp/health.json > /dev/null
          curl --fail --silent http://127.0.0.1:3000/robots.txt | grep 'Disallow: /admin' > /dev/null
          curl --fail --silent http://127.0.0.1:3000/sitemap.xml > /tmp/sitemap.xml
          grep '/rayon/' /tmp/sitemap.xml > /dev/null
          grep '/bakida-pc-klublari' /tmp/sitemap.xml > /dev/null
          grep '/bakida-playstation-klublari' /tmp/sitemap.xml > /dev/null
          ! grep '/tip/pc' /tmp/sitemap.xml > /dev/null
          ! grep '/tip/playstation' /tmp/sitemap.xml > /dev/null
          grep '/klub-sahibi' /tmp/sitemap.xml > /dev/null
          curl --fail --silent http://127.0.0.1:3000/bakida-pc-klublari > /tmp/pc.html
          grep 'rel="canonical" href="https://gameyerr-gameyer.vercel.app/bakida-pc-klublari"' /tmp/pc.html > /dev/null
          curl --fail --silent http://127.0.0.1:3000/bakida-playstation-klublari > /tmp/ps.html
          grep 'rel="canonical" href="https://gameyerr-gameyer.vercel.app/bakida-playstation-klublari"' /tmp/ps.html > /dev/null
          curl --silent --dump-header /tmp/old-pc-headers --output /dev/null http://127.0.0.1:3000/tip/pc
          grep -Ei '^HTTP/.* 308' /tmp/old-pc-headers > /dev/null
          grep -Ei '^location: /bakida-pc-klublari' /tmp/old-pc-headers > /dev/null
          curl --silent --dump-header /tmp/old-ps-headers --output /dev/null http://127.0.0.1:3000/tip/playstation
          grep -Ei '^HTTP/.* 308' /tmp/old-ps-headers > /dev/null
          grep -Ei '^location: /bakida-playstation-klublari' /tmp/old-ps-headers > /dev/null
          curl --fail --silent http://127.0.0.1:3000/elaqe > /tmp/elaqe.html
          grep 'rel="canonical" href="https://gameyerr-gameyer.vercel.app/elaqe"' /tmp/elaqe.html > /dev/null
          curl --fail --silent http://127.0.0.1:3000/mexfilik > /tmp/mexfilik.html
          grep 'rel="canonical" href="https://gameyerr-gameyer.vercel.app/mexfilik"' /tmp/mexfilik.html > /dev/null
          curl --fail --silent http://127.0.0.1:3000/klub-sahibi > /tmp/klub-sahibi.html
          grep 'rel="canonical" href="https://gameyerr-gameyer.vercel.app/klub-sahibi"' /tmp/klub-sahibi.html > /dev/null
          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest > /dev/null
          curl --fail --silent http://127.0.0.1:3000/pwa-icon/192 > /dev/null
          curl --fail --silent http://127.0.0.1:3000/pwa-icon/512 > /dev/null
          curl --fail --silent http://127.0.0.1:3000/opengraph-image > /dev/null
          curl --fail --silent http://127.0.0.1:3000/apple-icon > /dev/null
          curl --fail --silent http://127.0.0.1:3000/admin/login > /dev/null
          curl --silent --dump-header /tmp/admin-headers --output /dev/null http://127.0.0.1:3000/admin
          grep -Ei '^location: .*\/admin\/login' /tmp/admin-headers > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/this-route-must-not-exist)" = "404"
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const xml = fs.readFileSync('/tmp/sitemap.xml', 'utf8');
            const paths = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => new URL(match[1]).pathname);
            if (paths.length < 36) throw new Error(`Expected at least 36 sitemap URLs, got ${paths.length}`);
            for (const path of paths) {
              const response = await fetch(`http://127.0.0.1:3000${path}`);
              if (!response.ok) throw new Error(`${path} returned ${response.status}`);
            }
            console.log(`Smoke-tested ${paths.length} sitemap routes successfully.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/gameyer-next.pid ]; then
            kill "$(cat /tmp/gameyer-next.pid)" || true
          fi
