name: CI

on:
  push:
    branches: [main, launch-hardening, security-max-free-hardening]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://uxcedpbumulpheglhlvs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZRyHR5Qj2LmbCZVsKTBZ4Q_eRByoSYf
      NEXT_PUBLIC_SITE_URL: https://gameyer.az
      # Recovery PR only: compile and browser-test against the same checked,
      # visibility-gated static public catalog used by production.
      # Main still builds with its existing live-data/OIDC contract.
      GAMEYER_NEON_EMERGENCY_READS: ${{ github.head_ref == 'perf/cross-request-public-inventory-cache-20261012' && '1' || '0' }}
      GAMEYER_NEON_STATIC_CATALOG: ${{ github.head_ref == 'perf/cross-request-public-inventory-cache-20261012' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject committed private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- ':?[^A-Z_](SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|DATABASE_URL|POSTGRES_PASSWORD|VERCEL_TOKEN|GITHUB_TOKEN)[[:space:]]*=' -- . ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo 'Potential private credential assignment committed to the repository.' >&2
            exit 1
          fi
          if git grep -nE -- 'sb_secret_[A-Za-z0-9_-]{16,}' -- . ':!package-lock.json'; then
            echo 'Potential Supabase secret key committed to the repository.' >&2
            exit 1
          fi

      - name: Validate migration manifest
        run: |
          set -euo pipefail
          sort supabase/production-migrations.txt > /tmp/expected-migrations.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed 's/\.sql$//' \
            | sort > /tmp/repo-migrations.txt
          diff -u /tmp/expected-migrations.txt /tmp/repo-migrations.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Mint trusted public-data OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://gameyer.az/public-data-ci');
            core.setSecret(token);
            core.exportVariable('GAMEYER_CI_OIDC_TOKEN', token);

      - name: Verify live trusted Supabase read and original club photo availability
        shell: bash
        run: |
          set -euo pipefail
          # This uses the already-minted GitHub Actions OIDC token. It does not
          # grant public anon access or print secrets into the workflow logs.
          test -n "${GAMEYER_CI_OIDC_TOKEN:-}" || { echo 'Missing trusted CI OIDC'; exit 1; }
          cat > /tmp/gameyer-public-read.json <<'JSON'
          {"url":"https://uxcedpbumulpheglhlvs.supabase.co/rest/v1/clubs?select=id%2Cslug&is_active=eq.true&limit=1","method":"GET","headers":{"accept":"application/json"}}
          JSON
          status="$(curl --silent --show-error --max-time 20 \
            --output /tmp/gameyer-public-read-response.json \
            --write-out '%{http_code}' \
            -X POST 'https://uxcedpbumulpheglhlvs.supabase.co/functions/v1/gameyer-public-data-proxy' \
            -H 'content-type: application/json' \
            -H "x-gameyer-github-oidc: $GAMEYER_CI_OIDC_TOKEN" \
            --data-binary @/tmp/gameyer-public-read.json)"
          echo "Trusted public-data proxy response status: $status"
          test "$status" = 200 || { echo 'Live Supabase public read failed; block recovery cutover.' >&2; exit 1; }
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/gameyer-public-read-response.json', 'utf8'));
          if (!Array.isArray(data) || data.length !== 1 || typeof data[0].slug !== 'string') {
            throw new Error('Trusted public-data proxy returned an invalid club response.');
          }
          console.log('Validated authorized live Supabase public club read (one row).');
          NODE
          # Preserve the original Supabase Storage image URLs. Never replace
          # original photographs with an invented or cross-club substitute.
          image_status="$(curl --silent --show-error --location --head --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            'https://uxcedpbumulpheglhlvs.supabase.co/storage/v1/object/public/club-images/1d0b68d6-d39a-4a8b-85a8-60c97171a89d/profile/1787320301757-b6b263b6-5c3d-41a8-9f15-dd35b7db9f03.jpg')"
          echo "Original Supabase club photo response status: $image_status"
          test "$image_status" = 200

      - name: Start production server
        run: |
          npm run start > /tmp/gameyer-next.log 2>&1 &
          echo $! > /tmp/gameyer-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gameyer-next.log
          exit 1

      - name: Smoke test security and public routes
        run: |
          set -euo pipefail
          curl --fail --silent --dump-header /tmp/public-headers --output /dev/null http://127.0.0.1:3000/
          grep -Ei "^content-security-policy: .*default-src 'self'" /tmp/public-headers > /dev/null
          grep -Ei "^content-security-policy: .*frame-ancestors 'none'" /tmp/public-headers > /dev/null
          grep -Ei "^content-security-policy: .*script-src-attr 'none'" /tmp/public-headers > /dev/null
          grep -Ei '^x-frame-options: DENY' /tmp/public-headers > /dev/null
          grep -Ei '^x-content-type-options: nosniff' /tmp/public-headers > /dev/null
          grep -Ei '^strict-transport-security: max-age=31536000; includeSubDomains' /tmp/public-headers > /dev/null
          grep -Ei '^cross-origin-opener-policy: same-origin' /tmp/public-headers > /dev/null
          grep -Ei '^cross-origin-resource-policy: same-origin' /tmp/public-headers > /dev/null
          grep -Ei '^permissions-policy: .*camera=\(\).*microphone=\(\)' /tmp/public-headers > /dev/null

          curl --fail --silent --dump-header /tmp/health-headers --output /tmp/health.json http://127.0.0.1:3000/api/health
          grep -Ei '^x-robots-tag: noindex, nofollow' /tmp/health-headers > /dev/null
          grep '"ok":true' /tmp/health.json > /dev/null
          grep '"database":"ok"' /tmp/health.json > /dev/null
          ! grep -E 'activeClubs|responseMs|timestamp' /tmp/health.json > /dev/null

          curl --fail --silent http://127.0.0.1:3000/admin/login > /tmp/admin-login.html
          grep -E '<meta[^>]+content="[^"]*noindex[^"]*"' /tmp/admin-login.html > /dev/null
          ! grep -F '>Dashboard<' /tmp/admin-login.html > /dev/null
          ! grep -F '>Klublar<' /tmp/admin-login.html > /dev/null

          curl --silent --dump-header /tmp/admin-headers --output /dev/null http://127.0.0.1:3000/admin
          grep -Ei '^location: .*\/admin\/login' /tmp/admin-headers > /dev/null
          curl --silent --dump-header /tmp/mfa-headers --output /dev/null http://127.0.0.1:3000/admin/mfa
          grep -Ei '^location: .*\/admin\/login' /tmp/mfa-headers > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/this-route-must-not-exist)" = "404"

          curl --fail --silent http://127.0.0.1:3000/robots.txt > /tmp/robots.txt
          grep 'Disallow: /api/' /tmp/robots.txt > /dev/null
          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest > /dev/null
          curl --fail --silent http://127.0.0.1:3000/pwa-icon/192 > /dev/null
          curl --fail --silent http://127.0.0.1:3000/pwa-icon/512 > /dev/null

          node <<'NODE'
          const base = 'http://127.0.0.1:3000';
          (async () => {
            const checkedPaths = new Set();
            for (const path of ['/', '/rayon', '/tip', '/yaxinliqda-gaming-klublari', '/bakida-pc-klublari', '/bakida-internet-klublari', '/bakida-playstation-klublari', '/bakida-gaming-klub-qiymetleri', '/bakida-ucuz-pc-klublari', '/bakida-ucuz-playstation-klublari', '/bakida-24-saat-gaming-klublari', '/elaqe', '/mexfilik']) {
              const response = await fetch(`${base}${path}`, { redirect: 'manual' });
              if (response.status < 200 || response.status >= 300) throw new Error(`${path}: ${response.status}`);
              checkedPaths.add(path);
            }
            const sitemap = await (await fetch(`${base}/sitemap.xml`)).text();
            const paths = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map((m) => new URL(m[1]).pathname);
            if (paths.length < 36) throw new Error(`Expected at least 36 sitemap URLs, got ${paths.length}`);
            for (const path of paths) {
              // These URLs were already checked above during the same run.
              if (checkedPaths.has(path)) continue;
              const response = await fetch(`${base}${path}`, { redirect: 'manual' });
              if (response.status < 200 || response.status >= 300) throw new Error(`Sitemap URL ${path}: ${response.status}`);
              checkedPaths.add(path);
            }
            console.log(`Security/public smoke-tested ${paths.length} sitemap routes successfully (${checkedPaths.size} unique paths).`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Controlled API abuse regression tests
        run: |
          set -euo pipefail
          endpoint='http://localhost:3000/api/analytics/visit'
          same_origin='http://localhost:3000'

          expect_status() {
            expected="$1"
            label="$2"
            shift 2
            actual="$(curl --silent --output /dev/null --write-out '%{http_code}' "$@")"
            echo "$label -> $actual"
            test "$actual" = "$expected"
          }

          # Every request below must be rejected before any database insert occurs.
          expect_status 403 cross-origin \
            -X POST "$endpoint" \
            -H 'Origin: https://attacker.invalid' \
            -H 'Content-Type: application/json' \
            --data '{"sessionId":"securitytest1","path":"/"}'

          expect_status 415 wrong-content-type \
            -X POST "$endpoint" \
            -H "Origin: $same_origin" \
            -H 'Content-Type: text/plain' \
            --data '{}'

          expect_status 400 malformed-json \
            -X POST "$endpoint" \
            -H "Origin: $same_origin" \
            -H 'Content-Type: application/json' \
            --data '{'

          expect_status 400 forbidden-path \
            -X POST "$endpoint" \
            -H "Origin: $same_origin" \
            -H 'Content-Type: application/json' \
            --data '{"sessionId":"securitytest1","path":"/admin"}'

          node -e "process.stdout.write(JSON.stringify({sessionId:'securitytest1',path:'/',padding:'x'.repeat(2048)}))" > /tmp/oversized-analytics.json
          expect_status 413 oversized-body \
            -X POST "$endpoint" \
            -H "Origin: $same_origin" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/oversized-analytics.json

          node <<'NODE'
          const endpoint = 'http://localhost:3000/api/analytics/visit';
          const encoder = new TextEncoder();
          const stream = new ReadableStream({
            start(controller) {
              controller.enqueue(encoder.encode('{"sessionId":"securitytest2","path":"/","padding":"'));
              controller.enqueue(encoder.encode('x'.repeat(2048)));
              controller.enqueue(encoder.encode('"}'));
              controller.close();
            },
          });

          fetch(endpoint, {
            method: 'POST',
            headers: {
              Origin: 'http://localhost:3000',
              'Content-Type': 'application/json',
            },
            body: stream,
            duplex: 'half',
          }).then((response) => {
            console.log(`chunked-oversized-body -> ${response.status}`);
            if (response.status !== 413) process.exit(1);
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Exercise live Supabase mode locally without changing Vercel production
        shell: bash
        run: |
          set -euo pipefail
          # Test the exact recovery switches OFF against GitHub's trusted OIDC,
          # without touching the gameyer.az alias or deployed production flags.
          GAMEYER_NEON_EMERGENCY_READS=0 GAMEYER_NEON_STATIC_CATALOG=0 PORT=3100 npm run start > /tmp/gameyer-live-supabase.log 2>&1 &
          echo $! > /tmp/gameyer-live-supabase.pid
          for i in {1..30}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3100/api/health > /tmp/gameyer-live-health.json; then
              break
            fi
            sleep 1
          done
          grep '"ok":true' /tmp/gameyer-live-health.json > /dev/null
          grep '"database":"ok"' /tmp/gameyer-live-health.json > /dev/null
          node <<'NODE'
          const base = 'http://127.0.0.1:3100';
          const check = async (path) => {
            const res = await fetch(base + path, { redirect: 'manual', signal: AbortSignal.timeout(20000) });
            if (res.status !== 200) throw new Error(`Live Supabase ${path}: HTTP ${res.status}`);
            return res;
          };
          (async () => {
            for (const path of ['/', '/?type=pc&price_max=3', '/?q=apex', '/rayon', '/robots.txt', '/admin/login']) {
              await check(path);
            }
            const sitemap = await (await check('/sitemap.xml')).text();
            const paths = [...sitemap.matchAll(new RegExp('<loc>(.*?)</loc>', 'g'))].map(m => new URL(m[1]).pathname);
            if (paths.length !== 110) throw new Error(`Live Supabase sitemap expected 110 URLs; got ${paths.length}`);
            // Bounded concurrency to avoid a synthetic Supabase request storm.
            for (let offset = 0; offset < paths.length; offset += 4) {
              await Promise.all(paths.slice(offset, offset + 4).map(path => check(path)));
            }
            const missing = await fetch(base + '/gameyer-nonexistent-404', { redirect: 'manual' });
            if (missing.status !== 404) throw new Error(`Live Supabase 404 response: ${missing.status}`);
            console.log(`Live Supabase smoke passed: ${paths.length} sitemap pages + filters, SEO, health, admin login and 404.`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Stop live Supabase smoke server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/gameyer-live-supabase.pid ]; then
            kill "$(cat /tmp/gameyer-live-supabase.pid)" || true
          fi

      - name: Verify production build with real Supabase mode
        shell: bash
        run: |
          set -euo pipefail
          # Catch build-time Supabase/OIDC failures before touching production.
          # The trusted GitHub OIDC path is already provisioned above.
          GAMEYER_NEON_EMERGENCY_READS=0 GAMEYER_NEON_STATIC_CATALOG=0 npm run build

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/gameyer-next.pid ]; then
            kill "$(cat /tmp/gameyer-next.pid)" || true
          fi
