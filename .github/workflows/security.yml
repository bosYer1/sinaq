name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.pem$|.*\.key$)'
          bad="$(git ls-files | grep -E "$forbidden" | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo "Forbidden secret-like files are tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Scan tracked source for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sb_secret_[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}' -- ':!package-lock.json'; then
            echo 'High-confidence secret material detected in tracked source.'
            exit 1
          fi

      - name: Scan git history for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sb_secret_[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}'
          found=0
          while IFS= read -r commit; do
            if git grep -nE "$patterns" "$commit" -- ':!package-lock.json' >/tmp/gameyer-history-secrets 2>/dev/null; then
              echo "High-confidence secret material exists in git history at commit $commit."
              cat /tmp/gameyer-history-secrets
              found=1
              break
            fi
          done < <(git rev-list --all)
          test "$found" = 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: bash scripts/npm-audit-retry.sh
